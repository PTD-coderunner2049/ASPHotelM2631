name: test
on:
  pull_request:
  push:
    branches: [main]

jobs:
  unit-and-api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with: { dotnet-version: 9.0.x }
      - run: dotnet build tests/ASPHotelM2631.Tests.Unit -c Release
      - run: dotnet build tests/ASPHotelM2631.Tests.Api -c Release
      - name: Unit tests
        run: dotnet test tests/ASPHotelM2631.Tests.Unit -c Release --no-build --logger "trx;LogFileName=unit.trx" --results-directory TestResults
        continue-on-error: true            # vẫn sinh báo cáo khi có test fail; bước cuối mới quyết định đỏ/xanh
        id: unit
      - name: API + HTTPS tests (in-process, InMemory DB)
        run: dotnet test tests/ASPHotelM2631.Tests.Api -c Release --no-build --filter "Category!=Live" --logger "trx;LogFileName=api.trx" --results-directory TestResults
        continue-on-error: true
        id: api
      - name: Sinh Test Case doc + Test Result
        if: always()
        run: python3 tools/Generate-TestDocs.py --suites Unit,Api      # exit 1 nếu có NOT RUN / FAIL / SKIPPED / ORPHAN
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-docs
          path: |
            docs/testing/generated/
            TestResults/*.trx
      # UI (Selenium) và Live HTTPS cố ý KHÔNG chạy ở đây: cần người XEM test chạy (xem docs/testing/UI-EVIDENCE.md).
