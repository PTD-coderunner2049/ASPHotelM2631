<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Đăng nhập · Khách sạn</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="shell">
  <aside class="brand">
    <h1>Khách sạn</h1>
    <p>Đăng nhập để đặt phòng và quản lý thông tin của bạn.</p>
  </aside>

  <main class="panel"><div class="card">
    <div class="tabs" role="tablist">
      <button role="tab" id="tab-login" aria-selected="true">Đăng nhập</button>
      <button role="tab" id="tab-reg" aria-selected="false">Đăng ký</button>
    </div>

    <!-- ĐĂNG NHẬP -->
    <form id="f-login" novalidate>
      <h2>Chào mừng trở lại</h2>
      <p class="sub">Đăng nhập bằng email hoặc số điện thoại.</p>
      <label for="l-id">Email hoặc số điện thoại</label>
      <input type="text" id="l-id" autocomplete="username" maxlength="254">
      <div class="err" id="l-id-e"></div>
      <label for="l-pw">Mật khẩu</label>
      <div class="pw"><input type="password" id="l-pw" autocomplete="current-password"><button type="button" data-toggle="l-pw">Hiện</button></div>
      <div class="err" id="l-pw-e"></div>
      <div class="msg" id="l-msg" role="alert" aria-live="assertive"></div>
      <button class="btn" type="submit">Đăng nhập</button>
      <p class="switch">Chưa có tài khoản? <button type="button" data-tab="reg">Đăng ký</button></p>
    </form>

    <!-- ĐĂNG KÝ -->
    <form id="f-reg" novalidate hidden>
      <h2>Tạo tài khoản</h2>
      <p class="sub">Điền thông tin bên dưới để đăng ký.</p>
      <label for="r-name">Họ và tên</label>
      <input type="text" id="r-name" autocomplete="name" maxlength="100">
      <div class="err" id="r-name-e"></div>
      <label for="r-id">Email hoặc số điện thoại</label>
      <input type="text" id="r-id" autocomplete="username" maxlength="254">
      <div class="err" id="r-id-e"></div>
      <label for="r-pw">Mật khẩu</label>
      <div class="pw"><input type="password" id="r-pw" autocomplete="new-password"><button type="button" data-toggle="r-pw">Hiện</button></div>
      <div class="err" id="r-pw-e"></div>
      <label for="r-pw2">Nhập lại mật khẩu</label>
      <input type="password" id="r-pw2" autocomplete="new-password">
      <div class="err" id="r-pw2-e"></div>
      <label class="check"><input type="checkbox" id="r-ok"> Tôi đồng ý với điều khoản sử dụng và chính sách bảo mật.</label>
      <div class="err" id="r-ok-e"></div>
      <div class="msg" id="r-msg" role="alert" aria-live="assertive"></div>
      <button class="btn" type="submit">Đăng ký</button>
      <p class="switch">Đã có tài khoản? <button type="button" data-tab="login">Đăng nhập</button></p>
    </form>
  </div></main>
</div>

<script src="config.js"></script>
<script src="script.js"></script>
</body>
</html>
